<section class="staff-queue" aria-labelledby="staff-bookings-title">
  <header class="staff-queue__header">
    <h1 id="staff-bookings-title">{{ 'staff.bookings.title' | t }}</h1>
    <p class="staff-queue__lede">{{ 'staff.bookings.lede' | t }}</p>
  </header>

  <app-admin-resource-list
    [columns]="columns()"
    [loading]="loading()"
    [loadError]="loadError()"
    [emptyMessage]="'staff.bookings.empty' | t"
    [showSearch]="false"
    [page]="page()"
    [totalCount]="totalCount()"
    [hasNext]="hasNext()"
    [hasPrevious]="hasPrevious()"
    [rowCount]="rows().length"
    (pageChange)="onPage($event)"
    (retry)="onPage(page())"
  >
    @for (row of rows(); track row.id) {
      <tr>
        <td>{{ title(row) }}</td>
        <td>{{ when(row) }}</td>
        <td>
          @if (row.status) {
            <app-choice-enum-chip [choice]="row.status" />
          }
        </td>
        <td>{{ row.totalPrice }}</td>
        <td>
          <a [routerLink]="['/bookings', row.id]">
            <app-button type="button" variant="secondary" size="sm">
              {{ 'staff.view' | t }}
            </app-button>
          </a>
        </td>
      </tr>
    }
  </app-admin-resource-list>
</section>
