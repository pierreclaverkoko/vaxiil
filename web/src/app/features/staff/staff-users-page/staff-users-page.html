<section class="staff-queue" aria-labelledby="staff-users-title">
  <header class="staff-queue__header">
    <h1 id="staff-users-title">{{ 'staff.users.title' | t }}</h1>
    <p class="staff-queue__lede">{{ 'staff.users.lede' | t }}</p>
  </header>

  <app-admin-resource-list
    [columns]="columns()"
    [loading]="loading()"
    [loadError]="loadError()"
    [emptyMessage]="'staff.users.empty' | t"
    [page]="page()"
    [totalCount]="totalCount()"
    [hasNext]="hasNext()"
    [hasPrevious]="hasPrevious()"
    [rowCount]="rows().length"
    [search]="search()"
    [ordering]="ordering()"
    (searchChange)="onSearch($event)"
    (orderingChange)="onOrdering($event)"
    (pageChange)="onPage($event)"
    (retry)="onPage(page())"
  >
    <div filters>
      <app-option-card-group
        name="user-status"
        [compact]="true"
        [options]="statusOptions()"
        [value]="filterStatus()"
        (valueChange)="onFilterStatus($event)"
      />
    </div>

    @for (row of rows(); track row.id) {
      <tr>
        <td>{{ row.email }}</td>
        <td>{{ row.firstName }} {{ row.lastName }}</td>
        <td>
          @if (row.verificationStatus) {
            <app-choice-enum-chip [choice]="row.verificationStatus" />
          }
        </td>
        <td>
          <app-button type="button" variant="secondary" size="sm" (click)="openRow(row)">
            {{ (actionsFor(row).canReview ? 'staff.review' : 'staff.view') | t }}
          </app-button>
        </td>
      </tr>
    }
  </app-admin-resource-list>
</section>
