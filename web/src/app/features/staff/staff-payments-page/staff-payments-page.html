<section class="staff-queue" aria-labelledby="staff-payments-title">
  <header class="staff-queue__header">
    <h1 id="staff-payments-title">{{ 'staff.payments.title' | t }}</h1>
    <p class="staff-queue__lede">{{ 'staff.payments.lede' | t }}</p>
  </header>

  <app-admin-resource-list
    [columns]="columns()"
    [loading]="loading()"
    [loadError]="loadError()"
    [emptyMessage]="'staff.payments.empty' | t"
    [page]="page()"
    [totalCount]="totalCount()"
    [hasNext]="hasNext()"
    [hasPrevious]="hasPrevious()"
    [rowCount]="rows().length"
    [search]="search()"
    [ordering]="ordering()"
    (searchChange)="onSearch($event)"
    (orderingChange)="onOrdering($event)"
    (pageChange)="onPage($event)"
    (retry)="onPage(page())"
  >
    <div filters>
      <app-option-card-group
        name="payment-status"
        [compact]="true"
        [options]="statusOptions()"
        [value]="filterStatus()"
        (valueChange)="onFilterStatus($event)"
      />
    </div>

    @for (row of rows(); track row.id) {
      <tr>
        <td>{{ row.createdAt }}</td>
        <td>{{ row.amount }} {{ row.currencyCode }}</td>
        <td>{{ row.providerCode }}</td>
        <td>
          @if (row.kind) {
            <app-choice-enum-chip [choice]="row.kind" />
          }
        </td>
        <td>
          @if (row.status) {
            <app-choice-enum-chip [choice]="row.status" />
          }
        </td>
        <td>{{ row.userEmail }}</td>
      </tr>
    }
  </app-admin-resource-list>
</section>
