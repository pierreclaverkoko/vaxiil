<div class="legal">
  <h1>{{ title() }}</h1>
  @if (version()) {
    <p class="legal__version">{{ 'auth.legal.version' | t }}: {{ version() }}</p>
  }
  @if (loadError()) {
    <app-error-state [title]="'auth.legal.loadError' | t" [message]="loadError()!" />
  } @else if (loading()) {
    <p>{{ 'discover.loading' | t }}</p>
  } @else {
    <div class="legal__body" [innerHTML]="body() | markdown"></div>
  }
  <a routerLink="/login">{{ 'auth.legal.back' | t }}</a>
</div>
