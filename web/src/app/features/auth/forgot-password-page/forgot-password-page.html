<div class="auth-page">
  <h1>{{ 'auth.forgot.title' | t }}</h1>
  <p class="auth-page__lede">{{ 'auth.forgot.lede' | t }}</p>

  @if (formError()) {
    <p class="auth-page__error" role="alert">{{ formError() }}</p>
  }
  @if (formSuccess()) {
    <p class="auth-page__success" role="status">{{ formSuccess() }}</p>
  }

  @if (step() === 'request') {
    <form class="auth-page__form" (submit)="onRequest($event)">
      <app-input
        id="forgot-email"
        type="email"
        [label]="'auth.login.email' | t"
        autocomplete="email"
        [(value)]="email"
      />
      <app-turnstile (tokenChange)="onTurnstileToken($event)" />
      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [disabled]="submitting() || !turnstileToken()"
      >
        {{ 'auth.forgot.sendCode' | t }}
      </app-button>
    </form>
  } @else {
    <form class="auth-page__form" (submit)="onConfirm($event)">
      <app-input
        id="forgot-code"
        [label]="'profile.securityCode' | t"
        autocomplete="one-time-code"
        [(value)]="code"
      />
      <app-input
        id="forgot-password"
        type="password"
        [label]="'profile.securityNewPassword' | t"
        autocomplete="new-password"
        [(value)]="newPassword"
      />
      <app-turnstile (tokenChange)="onTurnstileToken($event)" />
      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [disabled]="submitting() || !turnstileToken()"
      >
        {{ 'auth.forgot.reset' | t }}
      </app-button>
    </form>
  }

  <p class="auth-page__footer">
    <a routerLink="/login">{{ 'auth.forgot.backToLogin' | t }}</a>
  </p>
</div>
