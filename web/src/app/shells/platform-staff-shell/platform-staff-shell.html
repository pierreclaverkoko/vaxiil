<div class="staff-shell">
  <a class="skip-link" href="#main-content">{{ 'common.skipToContent' | t }}</a>
  <aside class="staff-shell__sidebar">
    <a
      routerLink="/staff"
      class="staff-shell__brand"
      [attr.aria-label]="'shell.staff.homeAria' | t"
    >
      <app-vaxiil-logo [height]="32" [showPlate]="false" />
      <span class="staff-shell__badge">{{ 'shell.staff.badge' | t }}</span>
    </a>

    <nav class="staff-shell__nav" [attr.aria-label]="'shell.staff.navAria' | t">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="staff-shell__nav-link"
          [attr.title]="item.label"
        >
          <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span class="staff-shell__nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="staff-shell__footer">
      <a routerLink="/discover" class="staff-shell__exit">{{ 'common.backToApp' | t }}</a>
      <button type="button" class="staff-shell__logout" (click)="onLogout()">
        {{ 'profile.logout' | t }}
      </button>
    </div>
  </aside>

  <main id="main-content" class="staff-shell__main" tabindex="-1">
    <header class="staff-shell__toolbar">
      <a
        routerLink="/staff/notifications"
        class="staff-shell__icon-btn"
        [attr.aria-label]="'notifications.title' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
      </a>
    </header>
    <router-outlet />
  </main>
</div>
