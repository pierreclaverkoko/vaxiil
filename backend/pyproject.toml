[project]
name = "vaxiil"
version = "0.1.0"
description = "SaaS Wellness Platform for Massage, Therapy & Room Rentals"
authors = [
    {name = "Vaxiil Team", email = "team@vaxiil.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2,<5.0",
    "djangorestframework>=3.14.0",
    "django-cors-headers>=4.0.0",
    "django-extensions>=3.2.0",
    "psycopg2-binary>=2.9.0",
    "djangorestframework-simplejwt>=5.2.0",
    "django-filter>=24.0",
    "google-auth>=2.29.0",
    "celery>=5.3.0",
    "redis>=4.5.0",
    "channels>=4.0.0",
    "channels-redis>=4.1.0",
    "pillow>=10.0.0",
    "python-decouple>=3.8",
    "stripe>=6.0.0",
    "qrcode[pil]>=7.4.0",
    "uuid>=1.30",
    "ipython>=9.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "flake8>=6.0.0",
    "django-upgrade>=1.14.0",
    "pre-commit>=3.4.0",
    "factory-boy>=3.3.0",
    "model-bakery>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src"]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
    "*.egg",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "src.config.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"

[tool.django-upgrade]
target_version = "4.2"
